version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tb_ai_hub
      POSTGRES_USER: tb_admin
      POSTGRES_PASSWORD: tb_dev_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tb_admin -d tb_ai_hub"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://tb_admin:tb_dev_password_2026@db:5432/tb_ai_hub
      - SECRET_KEY=dev-secret-key-change-in-production-2026
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - UPLOAD_DIR=/app/uploads
      - LOG_LEVEL=DEBUG
    volumes:
      - ./app:/app/app
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  uploads:

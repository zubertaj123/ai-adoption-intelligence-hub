[project]
name = "ai-hub"
version = "1.0.0"
description = "the private equity firm AI Intelligence Hub — Backend API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
